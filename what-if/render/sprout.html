<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#9FD3F0;overflow:hidden;font-family:"Fredoka","Nunito","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif}
  canvas{display:block}
  .labels{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:space-around;padding:0 70px}
  .lab{background:#fff;border:5px solid #2B2B3A;border-radius:18px;padding:6px 18px;font-weight:800;font-size:26px;color:#2B2B3A;transform:rotate(-3deg);box-shadow:0 6px 0 rgba(43,43,58,.25)}
  .title{position:absolute;top:28px;left:40px;background:#fff;border:6px solid #2B2B3A;border-radius:22px;padding:8px 22px;font-weight:900;font-size:40px;color:#2B2B3A;transform:rotate(-3deg);box-shadow:0 7px 0 rgba(43,43,58,.25)}
  .title b{color:#E8B53A;-webkit-text-stroke:0}
</style></head>
<body>
<div class="title" id="title"></div>
<div class="labels" id="labels"></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'turnaround';
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9FD3F0');

const mat = (c, rough=0.62, extra={}) => new THREE.MeshPhysicalMaterial(Object.assign({color:c, roughness:rough, metalness:0, clearcoat:0.15, clearcoatRoughness:0.6, sheen:0.3, sheenColor:new THREE.Color('#ffffff')}, extra));

function makeBean({body='#F6EFE3', hoodie='#E8B53A', sprout=true, hair=null, cap=null, scale=1, mood='happy'} = {}) {
  const g = new THREE.Group();
  const R = 0.5, L = 0.6;
  const bodyMat = mat(body, 0.55);
  const bean = new THREE.Mesh(new THREE.CapsuleGeometry(R, L, 16, 48), bodyMat);
  bean.castShadow = true; g.add(bean);

  if (hoodie) {
    const hm = mat(hoodie, 0.85, {clearcoat:0, sheen:0.6, sheenColor:new THREE.Color('#fff2c4'),
      clippingPlanes:[]});
    const hoodGroup = new THREE.Group(); g.add(hoodGroup);
    const shell = new THREE.Mesh(new THREE.CapsuleGeometry(R+0.035, L, 16, 48), hm);
    shell.castShadow = true; hoodGroup.add(shell);
    hm.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0,-1,0), 0.02)];
    // rolled collar
    const collar = new THREE.Mesh(new THREE.TorusGeometry(R+0.04, 0.055, 16, 64), mat(hoodie,0.85,{clearcoat:0}));
    collar.rotation.x = Math.PI/2; collar.position.y = 0.0; collar.castShadow = true; g.add(collar);
    // hood lying on the back
    const hood = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), mat(hoodie,0.85,{clearcoat:0}));
    hood.scale.set(0.36, 0.26, 0.16); hood.position.set(0, 0.06, -0.52); hood.castShadow = true; g.add(hood);
    // pocket
    const pocket = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.42, 8, 16), mat(new THREE.Color(hoodie).multiplyScalar(0.88), 0.9, {clearcoat:0}));
    pocket.rotation.z = Math.PI/2; pocket.scale.set(1, 1, 0.35); pocket.position.set(0, -0.36, 0.515); g.add(pocket);
    // drawstrings
    for (const sx of [-0.09, 0.09]) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.2, 8), mat('#ffffff', 0.7));
      s.position.set(sx, -0.08, 0.555); s.rotation.x = -0.12; g.add(s);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 10), mat('#ffffff', 0.7));
      tip.position.set(sx, -0.18, 0.565); g.add(tip);
    }
  }
  // arms (sleeves if hoodie)
  for (const sx of [-1, 1]) {
    const arm = new THREE.Group();
    const sleeve = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.2, 8, 20), mat(hoodie || body, hoodie?0.85:0.55, {clearcoat: hoodie?0:0.15}));
    sleeve.castShadow = true; sleeve.position.y = -0.14; arm.add(sleeve);
    const nub = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), bodyMat);
    nub.position.y = -0.31; nub.castShadow = true; arm.add(nub);
    arm.position.set(sx*0.53, -0.04, 0.02);
    arm.rotation.z = sx*0.42; arm.rotation.x = -0.12;
    g.add(arm);
  }
  // legs
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.08, 8, 20), bodyMat);
    leg.position.set(sx*0.2, -0.86, 0.02); leg.castShadow = true; g.add(leg);
  }
  // face
  const black = new THREE.MeshPhysicalMaterial({color:'#15151c', roughness:0.15, clearcoat:1, clearcoatRoughness:0.05});
  const white = new THREE.MeshBasicMaterial({color:'#ffffff'});
  const face = new THREE.Group(); g.add(face);
  const surf = (x, y) => { // point on capsule surface (front)
    const cy = y > L/2 ? y - L/2 : 0;
    return Math.sqrt(Math.max(0.0001, R*R - x*x - cy*cy));
  };
  const eyeY = 0.36, eyeX = 0.165;
  for (const sx of [-1, 1]) {
    const x = sx*eyeX, z = surf(x, eyeY);
    const e = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), black);
    e.scale.set(0.078, 0.112, 0.04);
    e.position.set(x, eyeY, z - 0.012);
    e.lookAt(x*3, eyeY + (eyeY>L/2? (eyeY-L/2)*2:0), z*3);
    face.add(e);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 12), white);
    hl.position.set(x + 0.028, eyeY + 0.04, z + 0.028); face.add(hl);
    const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 10), white);
    hl2.position.set(x - 0.025, eyeY - 0.045, z + 0.022); face.add(hl2);
  }
  // mouth
  const mouthY = 0.2;
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.048, 0.013, 10, 24, Math.PI), black);
  mouth.position.set(0, mouthY, surf(0, mouthY) + 0.002);
  mouth.rotation.z = mood === 'happy' ? Math.PI : 0;
  face.add(mouth);

  if (sprout) {
    const green = mat('#6CC24A', 0.5);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.16, 10), green);
    stem.position.set(0, 0.86, 0); stem.castShadow = true; g.add(stem);
    for (const sx of [-1, 1]) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), green);
      leaf.scale.set(0.14, 0.035, 0.075);
      leaf.position.set(sx*0.12, 0.96, 0);
      leaf.rotation.z = sx*0.5;
      leaf.castShadow = true; g.add(leaf);
    }
  }
  if (hair) {
    const hm = mat(hair, 0.7);
    const top = new THREE.Mesh(new THREE.SphereGeometry(R+0.05, 32, 16, 0, Math.PI*2, 0, Math.PI*0.34), hm);
    top.position.y = L/2; top.castShadow = true; g.add(top);
    const back = new THREE.Mesh(new THREE.CylinderGeometry(R+0.05, R+0.07, 0.42, 32, 1, true, Math.PI*0.42, Math.PI*1.16), hm);
    back.position.y = 0.22; back.castShadow = true; g.add(back);
  }
  if (cap) {
    const cm = mat(cap, 0.75);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(R+0.03, 32, 16, 0, Math.PI*2, 0, Math.PI*0.36), cm);
    dome.position.y = L/2 + 0.02; dome.castShadow = true; g.add(dome);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 32, 1, false, -Math.PI/2, Math.PI), cm);
    brim.position.set(0, 0.62, 0.36); brim.rotation.x = 0.15; g.add(brim);
  }
  g.scale.setScalar(scale);
  return g;
}

// lights
scene.add(new THREE.HemisphereLight('#ffffff', '#f3d9b8', 1.15));
const sun = new THREE.DirectionalLight('#fff4e0', 2.1);
sun.position.set(3, 6, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 8; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, {left:-8, right:8, top:8, bottom:-8, near:0.5, far:30});
scene.add(sun);
const fill = new THREE.DirectionalLight('#cfe9ff', 0.6); fill.position.set(-4, 2, 3); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffffff', 0.9); rim.position.set(-2, 4, -5); scene.add(rim);

let camera;
const FEET = -0.99;

if (MODE === 'turnaround') {
  document.getElementById('title').innerHTML = 'SPROUT &nbsp;<b>·</b>&nbsp; model sheet';
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({opacity:0.18}));
  ground.rotation.x = -Math.PI/2; ground.position.y = FEET; ground.receiveShadow = true; scene.add(ground);
  const views = [['FRONT', 0], ['3/4', -0.75], ['SIDE', -Math.PI/2], ['BACK', Math.PI]];
  views.forEach(([name, rot], i) => {
    const b = makeBean(); b.position.x = (i - 1.5) * 1.75; b.rotation.y = rot; scene.add(b);
  });
  document.getElementById('labels').innerHTML = views.map(v => `<div class="lab">${v[0]}</div>`).join('');
  camera = new THREE.PerspectiveCamera(28, W/H, 0.1, 100);
  camera.position.set(0, 0.55, 12.2); camera.lookAt(0, 0.0, 0);
} else {
  document.getElementById('title').innerHTML = 'TOY BOX <b>·</b> style test';
  scene.background = new THREE.Color('#9FD3F0');
  // diorama base
  const base = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 0.6, 96), mat('#A8E6CF', 0.9, {clearcoat:0}));
  base.position.y = FEET - 0.3; base.receiveShadow = true; scene.add(base);
  const rimBase = new THREE.Mesh(new THREE.CylinderGeometry(6.25, 6.25, 0.5, 96), mat('#FFE8A3', 0.8));
  rimBase.position.y = FEET - 0.62; scene.add(rimBase);
  // path
  const path = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.02, 48), mat('#FFC8A8', 0.9, {clearcoat:0}));
  path.scale.set(1.6, 1, 0.8); path.position.set(0.2, FEET+0.005, 0.9); path.receiveShadow = true; scene.add(path);
  // puffball trees
  const tree = (x, z, s, c) => {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.7, 12), mat('#C98E6B', 0.8));
    trunk.position.y = 0.35; trunk.castShadow = true; t.add(trunk);
    [[0,1.0,0,0.55],[0.32,0.85,0.1,0.4],[-0.3,0.9,-0.05,0.42],[0.05,1.35,0,0.38]].forEach(([a,b,cz,r])=>{
      const p = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), mat(c, 0.85, {clearcoat:0}));
      p.position.set(a,b,cz); p.castShadow = true; t.add(p);
    });
    t.position.set(x, FEET, z); t.scale.setScalar(s); scene.add(t);
  };
  tree(-3.6, -2.2, 1.5, '#7FD4A8'); tree(3.7, -2.0, 1.35, '#FFB59A'); tree(-1.4, -3.6, 1.2, '#FFD36E');
  tree(1.6, -3.7, 1.25, '#7FD4A8'); tree(4.6, 0.3, 1.0, '#7FD4A8'); tree(-4.7, 0.6, 1.1, '#FFB59A');
  // bushes
  [[-2.4,1.8,'#7FD4A8'],[2.9,2.0,'#FFD36E'],[-0.8,-2.2,'#FFB59A']].forEach(([x,z,c])=>{
    const bu = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 16), mat(c,0.85,{clearcoat:0}));
    bu.scale.y = 0.75; bu.position.set(x, FEET+0.2, z); bu.castShadow = true; scene.add(bu);
  });
  // characters
  const hero = makeBean(); hero.position.set(0, 0, 0.9); hero.rotation.y = -0.15; scene.add(hero);
  const mom = makeBean({body:'#A8E6CF', hoodie:'#FF9FB2', sprout:false, hair:'#7A5236', scale:1.12});
  mom.position.set(-1.75, 0.12, -0.2); mom.rotation.y = 0.45; scene.add(mom);
  const kid = makeBean({body:'#CDB8F0', hoodie:'#5BB8E8', sprout:false, cap:'#FF6B5B', scale:0.85});
  kid.position.set(1.7, -0.15, 0.0); kid.rotation.y = -0.5; scene.add(kid);
  const kid2 = makeBean({body:'#FFC8A8', hoodie:'#A8E6CF', sprout:false, hair:'#2B2B3A', scale:0.9});
  kid2.position.set(2.9, -0.1, -1.1); kid2.rotation.y = -0.7; scene.add(kid2);
  document.getElementById('labels').innerHTML = '';
  camera = new THREE.PerspectiveCamera(32, W/H, 0.1, 100);
  camera.position.set(0.4, 3.4, 10.5); camera.lookAt(0.2, -0.2, 0);
}

renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
